AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Smart Employee Onboarding & Identity Service
Parameters:
  SenderEmail:
    Type: String
    Description: SES-verified sender address
  HrAlertEmail:
    Type: String
    Description: HR admin email that receives SNS alerts
  ReminderSeconds:
    Type: Number
    Default: 86400
    Description: Reminder interval (86400 = 24h, use 120 for a demo)
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        EMP_TABLE:
          Ref: EmployeesTable
        STAGE_TABLE:
          Ref: StagesTable
        DOC_BUCKET:
          Fn::Sub: onb-docs-${AWS::AccountId}-${AWS::Region}
        SENDER:
          Ref: SenderEmail
        TOPIC_ARN:
          Ref: HrTopic
        POOL_ID:
          Ref: UserPool
        SM_ARN:
          Fn::Sub: 
            arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:onboarding-workflow
        SITE_URL:
          Fn::GetAtt:
          - FrontendBucket
          - WebsiteURL
        REMINDER_SECONDS:
          Ref: ReminderSeconds
Resources:
  EmployeesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: employee_id
        AttributeType: S
      KeySchema:
      - AttributeName: employee_id
        KeyType: HASH
  StagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: employee_id
        AttributeType: S
      - AttributeName: stage
        AttributeType: S
      KeySchema:
      - AttributeName: employee_id
        KeyType: HASH
      - AttributeName: stage
        KeyType: RANGE
  DocBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: onb-docs-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
        - AllowedMethods:
          - POST
          - PUT
          - GET
          AllowedOrigins:
          - '*'
          AllowedHeaders:
          - '*'
          MaxAge: 3000
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: onb-site-${AWS::AccountId}-${AWS::Region}
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
  FrontendPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${FrontendBucket.Arn}/*
  HrTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: hr-admin-alerts
      Subscription:
      - Protocol: email
        Endpoint:
          Ref: HrAlertEmail
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: onboarding-users
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
      - Name: employee_id
        AttributeDataType: String
        Mutable: true
        StringAttributeConstraints:
          MinLength: '1'
          MaxLength: '64'
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
  GroupHr:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId:
        Ref: UserPool
      GroupName: HRAdmin
  GroupEmployees:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId:
        Ref: UserPool
      GroupName: Employees
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: onboarding-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:DeleteItem
            Resource:
            - Fn::GetAtt:
              - EmployeesTable
              - Arn
            - Fn::GetAtt:
              - StagesTable
              - Arn
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            Resource:
              Fn::Sub: arn:aws:s3:::onb-docs-${AWS::AccountId}-${AWS::Region}/*
          - Effect: Allow
            Action:
            - ses:SendEmail
            - ses:SendRawEmail
            Resource: '*'
          - Effect: Allow
            Action: sns:Publish
            Resource:
              Ref: HrTopic
          - Effect: Allow
            Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminDeleteUser
            Resource:
              Fn::GetAtt:
              - UserPool
              - Arn
          - Effect: Allow
            Action: states:StartExecution
            Resource:
              Fn::Sub: 
                arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:onboarding-workflow
          - Effect: Allow
            Action: states:SendTaskSuccess
            Resource: '*'
          - Effect: Allow
            Action: states:StopExecution
            Resource:
              Fn::Sub: 
                arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:onboarding-workflow:*
          - Effect: Allow
            Action: s3:ListBucket
            Resource:
              Fn::Sub: arn:aws:s3:::onb-docs-${AWS::AccountId}-${AWS::Region}
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowHeaders:
        - authorization
        - content-type
        AllowMethods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer:
                Fn::Sub: 
                  https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
              - Ref: UserPoolClient
  ApiFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.api_handler
      Role:
        Fn::GetAtt:
        - LambdaRole
        - Arn
      CodeUri: 
        s3://onb-artifacts-205542837590-ap-south-1/e99154c1fcffa263685d7e6011e03ca1
      Events:
        ListEmployees:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /employees
            Method: GET
        CreateEmployee:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /employees
            Method: POST
        Progress:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /employees/{id}/progress
            Method: GET
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /employees/{id}/upload-url
            Method: POST
        CompleteStage:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /employees/{id}/stages/{stage}/complete
            Method: POST
        ResendOffer:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /employees/{id}/offer-letter
            Method: POST
        RemoveEmployee:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /employees/{id}
            Method: DELETE
  StageStartFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.stage_start
      Role:
        Fn::GetAtt:
        - LambdaRole
        - Arn
      CodeUri: 
        s3://onb-artifacts-205542837590-ap-south-1/e99154c1fcffa263685d7e6011e03ca1
  ReminderFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.send_reminder
      Role:
        Fn::GetAtt:
        - LambdaRole
        - Arn
      CodeUri: 
        s3://onb-artifacts-205542837590-ap-south-1/e99154c1fcffa263685d7e6011e03ca1
  FinalizeFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.finalize
      Role:
        Fn::GetAtt:
        - LambdaRole
        - Arn
      CodeUri: 
        s3://onb-artifacts-205542837590-ap-south-1/e99154c1fcffa263685d7e6011e03ca1
  ValidateFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.validate_document
      Role:
        Fn::GetAtt:
        - LambdaRole
        - Arn
      CodeUri: 
        s3://onb-artifacts-205542837590-ap-south-1/e99154c1fcffa263685d7e6011e03ca1
      Events:
        Upload:
          Type: S3
          Properties:
            Bucket:
              Ref: DocBucket
            Events: s3:ObjectCreated:*
  OnboardingSM:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: onboarding-workflow
      DefinitionUri:
        Bucket: onb-artifacts-205542837590-ap-south-1
        Key: d1798b2c006cab02aa8b0e22747d434c
      DefinitionSubstitutions:
        StageStartArn:
          Fn::GetAtt:
          - StageStartFn
          - Arn
        ReminderArn:
          Fn::GetAtt:
          - ReminderFn
          - Arn
        FinalizeArn:
          Fn::GetAtt:
          - FinalizeFn
          - Arn
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: StageStartFn
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ReminderFn
      - LambdaInvokePolicy:
          FunctionName:
            Ref: FinalizeFn
Outputs:
  ApiUrl:
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value:
      Ref: UserPool
  ClientId:
    Value:
      Ref: UserPoolClient
  FrontendBucket:
    Value:
      Ref: FrontendBucket
  SiteUrl:
    Value:
      Fn::GetAtt:
      - FrontendBucket
      - WebsiteURL
  DocBucketName:
    Value:
      Fn::Sub: onb-docs-${AWS::AccountId}-${AWS::Region}
